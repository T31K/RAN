<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RanOdyssey</title>
<style>
  :root { --bg: #07080c; --fg: #f1e9e4; --muted: #d8c6bf; --accent: #e0322c; --error: #ff8a7a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #canvas { display: block; position: fixed; inset: 0; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: flex-end; gap: 14px; padding: 16px 16px 7vh; text-align: center;
             background: linear-gradient(to top, rgba(7,8,12,.92) 0%, rgba(7,8,12,0) 38%),
                         url(splash.jpg) center 30% / cover no-repeat, var(--bg); }
  #overlay[hidden] { display: none; }
  /* The art carries the logo; the heading stays for screen readers and the tab. */
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
  #status { max-width: 560px; color: var(--muted); min-height: 1.5em; text-shadow: 0 1px 3px #000; }
  #status.error { color: var(--error); }
  #bar { width: min(420px, 90vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  #bar[hidden] { display: none; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="overlay">
  <h1>RanOdyssey</h1>
  <div id="bar" hidden><div id="fill"></div></div>
  <div id="status">Loading…</div>
</div>
<script src="loader.js"></script>
</body>
</html>

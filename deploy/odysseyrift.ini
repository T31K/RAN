# Odyssey Rift config - copy next to FieldServer.exe (/opt/ran/game-client/odysseyrift.ini).
# Reload in game (GM): type "rift reload". Positions are world x z (GM: "rift pos").
enabled = 1

# Arena: Hangout 2F, the spare channel-3 copy (the real Hangout stays untouched).
# Map is centred on 0,0 and ~1080 units across. Coordinates below come from the minimap
# (x = -542 + px*2.115, z = 540 - py*2.109 on the 512px minimap) - calibrate with "rift pos".
arena_map = 153 0
entry_map = 5 0                 # MP_Campus - Mystic Peak Square
entry_pos = -12 -2608           # where T31K stood on the square mosaic
entry_radius = 400
entry_npc = 45 2                # Record Read Terminal (stand-in for the Trojan Horse)

nexus_pos = 0 100               # middle of the Main Hall
nexus_radius = 110
# Gold is the currency: kills pay straight into the wallet (no floor drops), EXP as normal.
gold_kill = 5000                # per common kill (special x2, boss x20), +10% per leg
gold_round = 25000              # per voyager per survived leg, +20% per leg
seal_npc = 45 6                 # Underground Passage Terminal marks each Rift Seal

